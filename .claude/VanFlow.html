  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ap;\n  src: url(\"21638415-64c8-4edb-b1f8-69cc629b19fa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c8be6c3b-4a40-4c7e-9d37-26a8763d7b2d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8d773a74-bfbe-46f4-9a7f-045812ecea4a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e76c69fa-b0f7-4607-b37b-275ed70f13a9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  /* === Surfaces (warm light) === */\n  --bg:#F2EEE5;            /* stage around phone */\n  --bg2:#FAF8F3;           /* main phone bg */\n  --bg3:#F5F2EA;           /* slightly recessed */\n  --s1:#FFFFFF;            /* card surface */\n  --s2:#F5F2EA;            /* subtle elevated */\n  --s3:#ECE7DB;            /* depressed input */\n\n  /* === Borders === */\n  --b1:rgba(20,24,31,.06);\n  --b2:rgba(20,24,31,.10);\n  --b3:rgba(20,24,31,.16);\n\n  /* === Ink (text) === */\n  --t1:#14181F;\n  --t2:#5B6470;\n  --t3:#9CA2AB;\n\n  /* === Semantic (kept var names) === */\n  --blue:#2E5BA8;\n  --blue2:#1D4280;\n  --green:#1F7A4D;\n  --amber:#B8541F;\n  --red:#B23B36;\n  --purple:#5847A8;\n  --teal:#0B6E5C;\n\n  /* === Accent === */\n  --accent:#0B6E5C;\n  --accent-2:#0F8C75;\n\n  /* === AI (restrained indigo, no neon gradient) === */\n  --ai:#5847A8;\n  --ai2:#3D2F87;\n  --ai-gradient:linear-gradient(135deg,#5847A8 0%,#0B6E5C 100%);\n\n  /* === Fonts === */\n  --f-ar:'IBM Plex Sans Arabic',sans-serif;\n  --f-en:'Geist',sans-serif;\n  --f-display:'Instrument Serif',serif;\n  --mono:'Geist Mono',monospace;\n\n  /* === Shadow tokens === */\n  --sh-1:0 1px 2px rgba(20,24,31,.04),0 1px 1px rgba(20,24,31,.03);\n  --sh-2:0 6px 18px rgba(20,24,31,.06),0 2px 4px rgba(20,24,31,.03);\n  --sh-3:0 24px 60px rgba(20,24,31,.10),0 8px 20px rgba(20,24,31,.05);\n}\n\n*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}\nhtml,body{height:100%;background:var(--bg);font-family:var(--f-ar);overflow:hidden;color:var(--t1);-webkit-font-smoothing:antialiased;}\n\n/* === LANG TOGGLE === */\n.lang-toggle{position:fixed;top:14px;right:18px;z-index:2000;display:flex;background:var(--s1);border:1px solid var(--b2);border-radius:999px;overflow:hidden;box-shadow:var(--sh-1);padding:3px;}\n.lang-btn{padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;transition:all .18s ease;font-family:var(--f-en);color:var(--t2);border-radius:999px;letter-spacing:.4px;}\n.lang-btn.active{background:var(--t1);color:#fff;}\n.lang-ar{font-family:var(--f-ar);}\n\nbody.ltr{direction:ltr;}\nbody.ltr *{font-family:var(--f-en);}\nbody.ltr .mono-val{font-family:var(--mono);}\n.ar-text{display:inline;}\n.en-text{display:none;}\nbody.ltr .ar-text{display:none;}\nbody.ltr .en-text{display:inline;}\n\n.shell{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden;}\n\n/* === MOBILE TOPBAR === */\n.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:58px;background:rgba(250,248,243,.88);border-bottom:1px solid var(--b1);z-index:1000;align-items:center;padding:0 18px;gap:14px;backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);}\n.mobile-topbar .logo-mark{width:32px;height:32px;border-radius:10px;background:var(--t1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;font-family:var(--f-display);font-style:italic;}\n.mobile-topbar-title{flex:1;font-size:14px;font-weight:600;letter-spacing:-.1px;}\n.mobile-topbar-title small{display:block;font-size:11px;color:var(--t2);font-weight:400;margin-top:1px;}\n.hamburger{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex-shrink:0;transition:all .15s;}\n.hamburger:hover{border-color:var(--b3);}\n.hamburger span{width:16px;height:1.5px;background:var(--t1);border-radius:1px;transition:all .25s;}\n.hamburger.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}\n.hamburger.open span:nth-child(2){opacity:0;}\n.hamburger.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}\n.menu-overlay{display:none;position:fixed;inset:0;background:rgba(20,24,31,.30);z-index:998;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px);}\n.menu-overlay.show{opacity:1;pointer-events:auto;}\n\n/* === SIDE NAV === */\n.screen-nav{width:240px;min-width:240px;background:var(--bg2);border-left:1px solid var(--b1);display:flex;flex-direction:column;padding:0 0 16px;overflow-y:auto;flex-shrink:0;}\nbody.ltr .screen-nav{border-left:none;border-right:1px solid var(--b1);}\n.screen-nav::-webkit-scrollbar{width:5px;}\n.screen-nav::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px;}\n.nav-logo{display:flex;align-items:center;gap:11px;padding:22px 18px 18px;border-bottom:1px solid var(--b1);margin-bottom:12px;}\n.nav-close{display:none;margin-right:auto;width:34px;height:34px;border-radius:10px;background:var(--s1);border:1px solid var(--b2);align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--t1);}\nbody.ltr .nav-close{margin-right:0;margin-left:auto;}\n.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--t1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;font-family:var(--f-display);font-style:italic;}\n.logo-title{font-size:14px;font-weight:600;font-family:var(--f-en);letter-spacing:-.2px;}\n.logo-sub{font-size:10px;color:var(--t2);margin-top:2px;letter-spacing:.3px;}\n.nav-section{font-size:9.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);padding:14px 18px 6px;}\n.nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s ease;position:relative;}\n.nav-item:hover{color:var(--t1);background:rgba(20,24,31,.03);}\n.nav-item.active{color:var(--t1);background:rgba(11,110,92,.06);font-weight:600;}\n.nav-item.active::before{content:'';position:absolute;right:0;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:var(--accent);}\nbody.ltr .nav-item.active::before{right:auto;left:0;}\n.nav-item.ai-nav.active{background:rgba(88,71,168,.06);}\n.nav-item.ai-nav.active::before{background:var(--ai);}\n.nav-icon{font-size:14px;width:18px;text-align:center;opacity:.85;}\n.nav-tag-ai{font-size:8.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--ai);color:#fff;margin-right:auto;font-family:var(--f-en);letter-spacing:.6px;}\nbody.ltr .nav-tag-ai{margin-right:0;margin-left:auto;}\n\n/* === DEVICE STAGE === */\n.device-stage{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#F8F4E8 0%,#EBE5D6 70%);position:relative;overflow:h );margin-top:2px;}\n\n/* === FLOATING AI BUTTON === */\n.ai-fab{position:absolute;bottom:104px;left:20px;z-index:80;width:54px;height:54px;border-radius:50%;background:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;color:#fff;box-shadow:0 16px 36px rgba(20,24,31,.30),0 4px 12px rgba(20,24,31,.18);border:1px solid rgba(255,255,255,.10);transition:transform .2s ease;}\n.ai-fab:hover{transform:translateY(-2px);}\nbody.ltr .ai-fab{left:auto;right:20px;}\n.ai-fab-badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9.5px;font-weight:600;font-family:var(--mono);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg2);}\nbody.ltr .ai-fab-badge{right:auto;left:-3px;}\n\n/* === TOPBAR === */\n.topbar{padding:18px 22px 14px;display:flex;align-items:center;gap:12px;background:var(--bg2);border-bottom:1px solid var(--b1);flex-shrink:0;position:sticky;top:0;z-index:10;}\n.topbar-t{font-size:18px;font-weight:600;flex:1;letter-spacing:-.3px;}\n.topbar-s{font-size:11.5px;color:var(--t2);margin-top:2px;font-weight:400;}\n.ic-btn{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;transition:all .15s ease;color:var(--t1);}\n.ic-btn:hover{border-color:var(--b3);transform:translateY(-1px);}\n.ic-btn-ai{background:rgba(88,71,168,.08);border-color:rgba(88,71,168,.20);color:var(--ai);}\n.back-btn{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;color:var(--t1);transition:all .15s;font-family:var(--f-en);}\n.back-btn:hover{background:var(--s2);}\n\n/* === SYNC / BADGES === */\n.sync{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:10.
