#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache.lock-timeout=10

#FlowVan app version — the ONLY place the shipped version is set.
#
#versionCode is what the updater compares; it must increase by 1 on every build
#you hand out, or devices will not see the build as newer and will never take it.
#versionName is only ever shown to a human.
flowvan.versionCode=1
flowvan.versionName=1.0
